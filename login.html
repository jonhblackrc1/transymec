<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ingreso · Transymec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body" data-page="login">
  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="brand auth-brand" aria-label="Transymec inicio">
          <img class="brand__logo" src="assets/logo/transymec-logo.svg" alt="TRANSYMEC — Transporte de pasajeros" width="300" height="72" />
        </a>

      <h1 class="auth-title">Acceso al sistema</h1>
      <p class="auth-sub">Administración y conductores. Ingresa con tu usuario y contraseña.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username"
                 placeholder="tu usuario" required autofocus />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pwd">
            <input type="password" id="password" name="password"
                   autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="pwd__toggle" id="pwdToggle" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Ingresar</button>
        <p class="form__msg" id="loginMsg" role="status"></p>
      </form>

      <div class="auth-demo" id="demoInfo" hidden></div>
      <p class="auth-alt">¿Eres pasajero? <a href="viaje.html">Sigue tu viaje con tu código y clave</a></p>
      <a href="index.html" class="auth-back">← Volver al sitio</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-config.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="auth.js"></script>
  <script>
    // Mostrar/ocultar contraseña
    const t = document.getElementById("pwdToggle");
    const p = document.getElementById("password");
    t.addEventListener("click", () => {
      const show = p.type === "password";
      p.type = show ? "text" : "password";
      t.textContent = show ? "🙈" : "👁";
    });
  </script>
</body>
</html>
