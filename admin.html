<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0F1E4D" />
  <title>CRM de viajes · Transymec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
  <link rel="stylesheet" href="crm.css" />
</head>
<body>
  <div class="boot" id="boot">Cargando…</div>

  <div class="shell" id="shell" hidden>
    <aside class="side" id="side">
      <a class="side__logo" href="#/panel"><img src="assets/logo/transymec-logo-blanco.svg" alt="TRANSYMEC" /></a>
      <nav id="sideNav"></nav>
      <div class="side__user">
        <span class="avatar" id="meAvatar"></span>
        <div><strong id="meName"></strong><span>Administrador</span></div>
        <button class="icon-btn" id="logout" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú"></button>
        <h1 id="title">Panel</h1>
        <div class="topbar__actions" id="actions"></div>
      </header>
      <div class="demo-slot" id="demoSlot"></div>
      <main class="content" id="view"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-config.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="js/crm-ui.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
